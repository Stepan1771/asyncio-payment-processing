services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    container_name: migrate
    command: alembic -c alembic.ini upgrade head
    working_dir: /app/src
    env_file:
      - .env.db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    container_name: app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    working_dir: /app/src
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.app
      - .env.db
    volumes:
      - app_logs:/app/src/logs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  publisher:
    build: .
    container_name: publisher
    command: python publisher.py
    working_dir: /app/src
    restart: unless-stopped
    env_file:
      - .env.db
      - .env.broker
      - .env.publisher
    volumes:
      - publisher_logs:/app/src/logs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  consumer:
    build: .
    container_name: consumer
    command: python consumer.py
    working_dir: /app/src
    restart: unless-stopped
    env_file:
      - .env.db
      - .env.broker
      - .env.consumer
      - .env.httpx
    volumes:
      - consumer_logs:/app/src/logs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  rabbitmq_data:
  app_logs:
  publisher_logs:
  consumer_logs:


